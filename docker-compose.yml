name: journalist

services:
  journalist:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    image: journalist:latest
    env_file: .env
    environment:
      DATA_DIR: /data
      TZ_PLAN: Europe/Moscow
    ports:
      # Director API, /health, /ready: reached on the host only, never through a proxy.
      - '127.0.0.1:8787:8080'
      # Public listener (WP-PLAT-07): the four public routes and nothing else. Caddy forwards
      # the four exact paths here (docs/connect.md). Open only when PUBLIC_BASE is set.
      - '127.0.0.1:8788:8081'
    volumes:
      - journalistdata:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m
    user: '10001:10001'
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  journalistdata:
