name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker build --build-arg GIT_SHA=${{ github.sha }} -t journalist:ci .
      - name: Container starts and the native SQLite module loads (/ready db ok)
        run: |
          docker run -d --name jci -p 127.0.0.1:18080:8080 -e TELEGRAM_BOT_TOKEN=ci-placeholder-token journalist:ci
          ok=0
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:18080/ready | tee /dev/stderr | grep -qF '"db":{"ok":true'; then ok=1; break; fi
            sleep 2
          done
          docker logs jci
          docker rm -f jci
          test "$ok" = 1
